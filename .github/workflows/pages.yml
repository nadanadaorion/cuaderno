name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # config.js no está versionado: se arma con las Variables del repo
      # (Settings › Secrets and variables › Actions › Variables).
      - name: Escribir config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan las variables SUPABASE_URL y SUPABASE_ANON_KEY." >&2
            echo "El cuaderno se desplegará sin nube: sólo almacenamiento local." >&2
            cp config.example.js config.js
          else
            cat > config.js <<EOF
          window.CUADERNO_CONFIG = {
            url: '$SUPABASE_URL',
            anonKey: '$SUPABASE_ANON_KEY'
          };
          EOF
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
